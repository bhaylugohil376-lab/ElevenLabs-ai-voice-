<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile — VoiceAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #fffdf7;
      color: #3b2117;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .navbar {
      height: 70px;
      background: #fff;
      border-bottom: 1px solid #eee5df;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #d96b27;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-links a:hover {
      color: #d96b27;
    }

    .logout-btn {
      border: 0;
      background: #fff0e8;
      color: #c4571c;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .container {
      width: min(1100px, 92%);
      margin: 40px auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 7px;
    }

    .welcome p {
      color: #806b61;
      font-size: 15px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 22px;
    }

    .card {
      background: #fff;
      border: 1px solid #eee5df;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 12px 35px rgba(59, 33, 23, .06);
    }

    .profile-card {
      text-align: center;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      margin: 0 auto 15px;
      background: #d96b27;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
    }

    .profile-card h2 {
      font-size: 21px;
      margin-bottom: 5px;
    }

    .email {
      color: #806b61;
      font-size: 14px;
      word-break: break-word;
    }

    .plan {
      display: inline-block;
      margin-top: 15px;
      padding: 7px 13px;
      border-radius: 20px;
      background: #fff0e8;
      color: #c4571c;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 22px;
    }

    .stat {
      background: #fffaf5;
      border: 1px solid #f0e5dd;
      border-radius: 13px;
      padding: 15px 10px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 21px;
      margin-bottom: 5px;
    }

    .stat span {
      font-size: 11px;
      color: #806b61;
    }

    .section-title {
      font-size: 19px;
      margin-bottom: 18px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .action {
      border: 1px solid #eee5df;
      background: #fffdfb;
      border-radius: 14px;
      padding: 17px;
      transition: .2s;
    }

    .action:hover {
      border-color: #d96b27;
      transform: translateY(-2px);
    }

    .action strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .action span {
      color: #806b61;
      font-size: 12px;
      line-height: 1.4;
    }

    .plan-box {
      margin-top: 22px;
      background: #3b2117;
      color: #fff;
      border-radius: 17px;
      padding: 21px;
    }

    .plan-box h3 {
      margin-bottom: 7px;
    }

    .plan-box p {
      color: #eadbd2;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .upgrade {
      display: inline-block;
      background: #d96b27;
      color: #fff;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #806b61;
    }

    .error {
      max-width: 500px;
      margin: 100px auto;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 800px) {
      .nav-links a {
        display: none;
      }

      .profile-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .navbar {
        padding: 0 18px;
      }

      .container {
        width: 94%;
        margin: 25px auto;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .card {
        padding: 19px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .stats {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">

    <a href="index.html" class="logo">
      ∿ Voice<span>AI</span>
    </a>

    <div class="nav-links">
      <a href="tools.html">AI Tools</a>
      <a href="voices.html">Voices</a>
      <a href="studio.html">Studio</a>
      <a href="pricing.html">Pricing</a>
    </div>

    <button id="logoutBtn" class="logout-btn">
      Logout
    </button>

  </nav>

  <main class="container" id="app">

    <div class="loading">
      Loading your profile...
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    "use strict";

    const supabaseClient = window.supabaseClient;
    const app = document.getElementById("app");
    const logoutBtn = document.getElementById("logoutBtn");

    let currentUser = null;
    let currentPlan = "free";


    function escapeHTML(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function getInitials(name, email) {
      const source =
        name ||
        email ||
        "U";

      const parts =
        source.trim().split(/\s+/);

      if (parts.length >= 2) {
        return (
          parts[0][0] +
          parts[1][0]
        ).toUpperCase();
      }

      return source
        .substring(0, 2)
        .toUpperCase();
    }


    async function loadProfile() {

      if (!supabaseClient) {
        showError(
          "Supabase is not connected. Check supabase-config.js."
        );
        return;
      }

      try {

        const {
          data: { session },
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
          throw sessionError;
        }

        if (!session) {
          window.location.replace("login.html");
          return;
        }

        currentUser = session.user;


        let fullName =
          currentUser.user_metadata?.full_name ||
          currentUser.user_metadata?.name ||
          "VoiceAI User";


        let plan = "free";


        /*
         * Read the profile created by the
         * Supabase database trigger.
         */

        const {
          data: profile,
          error: profileError
        } = await supabaseClient
          .from("profiles")
          .select("full_name, plan")
          .eq("id", currentUser.id)
          .maybeSingle();


        if (profileError) {
          console.warn(
            "Profile query warning:",
            profileError
          );
        }


        if (profile?.full_name) {
          fullName = profile.full_name;
        }


        if (profile?.plan) {
          plan = String(profile.plan).toLowerCase();
        }


        currentPlan = plan;


        renderProfile(
          fullName,
          currentUser.email || "",
          plan
        );


      } catch (error) {

        console.error(
          "Profile error:",
          error
        );

        showError(
          error.message ||
          "Unable to load your profile."
        );
      }
    }


    function renderProfile(name, email, plan) {

      const premium =
        plan === "premium" ||
        plan === "admin";


      const initials =
        getInitials(name, email);


      const planLabel =
        plan === "admin"
          ? "Admin"
          : plan === "premium"
            ? "Premium"
            : "Free";


      const usageLimit =
        premium
          ? "∞"
          : "5";


      app.innerHTML = `

        <section class="welcome">
          <h1>
            Welcome, ${escapeHTML(name)}
          </h1>

          <p>
            Manage your VoiceAI account and AI workspace.
          </p>
        </section>


        <section class="profile-grid">

          <div class="card profile-card">

            <div class="avatar">
              ${escapeHTML(initials)}
            </div>

            <h2>
              ${escapeHTML(name)}
            </h2>

            <div class="email">
              ${escapeHTML(email)}
            </div>

            <div class="plan">
              ${planLabel}
            </div>

            <div class="stats">

              <div class="stat">
                <strong>${usageLimit}</strong>
                <span>Daily AI Uses</span>
              </div>

              <div class="stat">
                <strong>24+</strong>
                <span>AI Tools</span>
              </div>

              <div class="stat">
                <strong>✓</strong>
                <span>Account</span>
              </div>

            </div>

          </div>


          <div>

            <div class="card">

              <h2 class="section-title">
                Quick Access
              </h2>

              <div class="actions">

                <a class="action" href="tts.html">
                  <strong>Text to Speech</strong>
                  <span>
                    Convert text into natural AI voice.
                  </span>
                </a>

                <a class="action" href="voices.html">
                  <strong>Voice Library</strong>
                  <span>
                    Browse and preview available voices.
                  </span>
                </a>

                <a class="action" href="clone.html">
                  <strong>Voice Clone</strong>
                  <span>
                    Create your own AI voice.
                  </span>
                </a>

                <a class="action" href="studio.html">
                  <strong>AI Studio</strong>
                  <span>
                    Create and edit voice projects.
                  </span>
                </a>

                <a class="action" href="dubbing.html">
                  <strong>Dubbing</strong>
                  <span>
                    Localize your audio and video.
                  </span>
                </a>

                <a class="action" href="agents.html">
                  <strong>Voice Agents</strong>
                  <span>
                    Build conversational AI agents.
                  </span>
                </a>

              </div>

            </div>


            ${
              premium
              ? `
                <div class="plan-box">

                  <h3>
                    ${plan === "admin"
                      ? "Admin Access"
                      : "Premium Plan"}
                  </h3>

                  <p>
                    ${
                      plan === "admin"
                      ? "Your account has administrator-level application access."
                      : "Your Premium plan provides unlimited application-level AI usage, subject to provider/API limits."
                    }
                  </p>

                </div>
              `
              : `
                <div class="plan-box">

                  <h3>
                    Free Plan
                  </h3>

                  <p>
                    You currently have 5 AI uses per day.
                    Upgrade to Premium for higher application-level usage.
                  </p>

                  <a
                    href="pricing.html"
                    class="upgrade"
                  >
                    Upgrade — $20/month
                  </a>

                </div>
              `
            }

          </div>

        </section>
      `;
    }


    function showError(text) {

      app.innerHTML = `
        <div class="card error">

          <h2>
            Unable to load profile
          </h2>

          <p style="
            color:#806b61;
            margin:12px 0 20px;
            line-height:1.5;
          ">
            ${escapeHTML(text)}
          </p>

          <a
            href="login.html"
            class="upgrade"
          >
            Go to Login
          </a>

        </div>
      `;
    }


    logoutBtn.addEventListener(
      "click",
      async () => {

        logoutBtn.disabled = true;
        logoutBtn.textContent = "Logging out...";

        try {

          if (supabaseClient) {
            await supabaseClient.auth.signOut();
          }

        } catch (error) {

          console.error(
            "Logout error:",
            error
          );

        } finally {

          window.location.replace("login.html");

        }
      }
    );


    /*
     * Keep the UI synchronized if the
     * Supabase auth state changes.
     */

    if (supabaseClient) {

      supabaseClient.auth.onAuthStateChange(
        (event, session) => {

          if (
            event === "SIGNED_OUT" ||
            !session
          ) {
            window.location.replace("login.html");
          }

        }
      );

    }


    loadProfile();
  </script>

</body>
</html>
