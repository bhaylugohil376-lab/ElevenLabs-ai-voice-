<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | VoiceAI</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f2ff;
      color: #211b35;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 34px;
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(50, 30, 100, .12);
    }

    .logo {
      text-align: center;
      font-size: 29px;
      font-weight: 800;
      color: #7354e8;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 0 0 28px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd8e9;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #7354e8;
      box-shadow: 0 0 0 3px rgba(115,84,232,.1);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #666;
    }

    .remember input {
      width: auto;
    }

    a {
      color: #7354e8;
      text-decoration: none;
      font-weight: 600;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 14px;
      margin-top: 22px;
      background: #7354e8;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .signup {
      text-align: center;
      margin-top: 24px;
      color: #777;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="logo">∿ VoiceAI</div>

    <h1>Welcome back</h1>

    <p class="subtitle">
      Login to continue to your VoiceAI account.
    </p>

    <form id="loginForm">

      <label for="email">Email address</label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <div class="row">

        <label class="remember">
          <input id="remember" type="checkbox">
          Remember email
        </label>

        <a href="forgot-password.html">
          Forgot password?
        </a>

      </div>

      <button id="loginButton" type="submit">
        Login
      </button>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite">
      </div>

    </form>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">Create account</a>
    </div>

    <a class="back" href="index.html">
      ← Back to VoiceAI
    </a>

  </main>

  <script>

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    const emailInput = document.getElementById("email");
    const rememberInput = document.getElementById("remember");

    function showMessage(text, success = false) {

      message.style.display = "block";
      message.textContent = text;

      message.style.background =
        success ? "#eaf8ef" : "#fff0f0";

      message.style.color =
        success ? "#176b38" : "#a32323";
    }

    // Restore saved email
    const savedEmail = localStorage.getItem("voiceai_email");

    if (savedEmail) {
      emailInput.value = savedEmail;
      rememberInput.checked = true;
    }

    // Check existing session
    async function checkSession() {

      try {

        const {
          data,
          error
        } = await supabaseClient.auth.getSession();

        if (error) {
          console.error(error);
          return;
        }

        if (data.session) {
          window.location.href = "profile.html";
        }

      } catch (error) {
        console.error(error);
      }
    }

    checkSession();

    // Login
    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = emailInput.value.trim();
      const password =
        document.getElementById("password").value;

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      try {

        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw error;
        }

        // Remember email
        if (rememberInput.checked) {
          localStorage.setItem(
            "voiceai_email",
            email
          );
        } else {
          localStorage.removeItem(
            "voiceai_email"
          );
        }

        showMessage(
          "Login successful. Redirecting...",
          true
        );

        setTimeout(function() {
          window.location.href = "profile.html";
        }, 500);

      } catch (error) {

        showMessage(
          error.message ||
          "Login failed. Please try again."
        );

        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }

    });

  </script>

</body>
</html>
