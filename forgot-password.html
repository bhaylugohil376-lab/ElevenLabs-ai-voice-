<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password — VoiceAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #fffdf7;
      color: #3b2117;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 32px;
      font-weight: 800;
    }

    .brand span {
      color: #d96b27;
    }

    .brand p {
      margin-top: 8px;
      color: #806b61;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid #eee5df;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 18px 50px rgba(59, 33, 23, .08);
    }

    h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #806b61;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #ded4cd;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      color: #3b2117;
      background: #fff;
    }

    input:focus {
      border-color: #d96b27;
      box-shadow: 0 0 0 3px rgba(217, 107, 39, .12);
    }

    .btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 13px;
      background: #d96b27;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff0ed;
      color: #a93226;
      border: 1px solid #f4c7c0;
    }

    .message.success {
      background: #edf9f0;
      color: #28763b;
      border: 1px solid #c6e8ce;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    a {
      color: #d96b27;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .back {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 18px;
      }

      .brand h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">
      <h1>∿ Voice<span>AI</span></h1>
      <p>Recover access to your account.</p>
    </div>

    <section class="card">

      <h2>Forgot password?</h2>

      <p class="subtitle">
        Enter your account email and we'll send you a secure
        password reset link.
      </p>

      <div id="message" class="message"></div>

      <form id="forgotForm">

        <div class="field">
          <label for="email">Email address</label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <button
          id="resetBtn"
          class="btn"
          type="submit"
        >
          Send Reset Link
        </button>

      </form>

      <div class="links">
        <a href="login.html">← Back to Login</a>
      </div>

      <div class="back">
        <a href="index.html">Back to VoiceAI</a>
      </div>

    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    "use strict";

    const supabaseClient = window.supabaseClient;

    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const resetBtn = document.getElementById("resetBtn");
    const message = document.getElementById("message");


    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message show " + type;
    }


    function setLoading(loading) {
      resetBtn.disabled = loading;

      resetBtn.textContent = loading
        ? "Sending..."
        : "Send Reset Link";
    }


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.className = "message";

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Please enter your email address.");
        return;
      }


      if (!supabaseClient) {
        showMessage(
          "Supabase is not connected. Check supabase-config.js."
        );
        return;
      }


      setLoading(true);


      try {

        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                "http://localhost:3000/reset-password.html"
            }
          );


        if (error) {
          throw error;
        }


        showMessage(
          "If this email is registered, a password reset link has been sent. Please check your inbox.",
          "success"
        );

        emailInput.value = "";

        setLoading(false);


      } catch (error) {

        console.error(
          "Password reset error:",
          error
        );

        showMessage(
          error.message ||
          "Unable to send the reset link."
        );

        setLoading(false);
      }

    });
  </script>

</body>
</html>
