<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password — VoiceAI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #f7f5fa;
      color: #17131f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .navbar {
      height: 70px;
      background: #fff;
      border-bottom: 1px solid #e5e1eb;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .nav-inner {
      width: min(1180px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: 850;
    }

    .logo span {
      color: #6d3df5;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      color: #625d69;
      font-size: 14px;
      font-weight: 650;
    }

    .nav-links a:hover {
      color: #6d3df5;
    }

    .nav-btn {
      padding: 10px 16px;
      border-radius: 10px;
      background: #6d3df5;
      color: white !important;
    }

    .page {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 18px;
    }

    .card {
      width: min(470px, 100%);
      background: white;
      border: 1px solid #e5e1eb;
      border-radius: 24px;
      padding: 42px;
      box-shadow: 0 25px 70px rgba(40, 25, 70, .09);
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #f0ebff;
      color: #6d3df5;
      display: grid;
      place-items: center;
      font-size: 27px;
      margin-bottom: 23px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #77717f;
      font-size: 14px;
      line-height: 1.65;
      margin-bottom: 27px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 750;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #dfdbe6;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #6d3df5;
      box-shadow: 0 0 0 4px rgba(109,61,245,.09);
    }

    .submit-btn {
      width: 100%;
      height: 52px;
      margin-top: 17px;
      border: 0;
      border-radius: 12px;
      background: #6d3df5;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #5528d8;
    }

    .submit-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 13px 14px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.55;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #ecf9f1;
      border: 1px solid #bce5ca;
      color: #176c43;
    }

    .message.error {
      background: #fff0f0;
      border: 1px solid #f1c3c3;
      color: #b42318;
    }

    .back {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #77717f;
    }

    .back a {
      color: #6d3df5;
      font-weight: 800;
    }

    @media (max-width: 600px) {
      .nav-links a:not(.nav-btn) {
        display: none;
      }

      .card {
        padding: 30px 22px;
        border-radius: 20px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="nav-inner">

    <a href="index.html" class="logo">
      Voice<span>AI</span>
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="tools.html">AI Tools</a>
      <a href="pricing.html">Pricing</a>
      <a href="login.html" class="nav-btn">Login</a>
    </nav>

  </div>
</header>


<main class="page">

  <section class="card">

    <div class="icon">🔐</div>

    <h1>Forgot password?</h1>

    <p class="subtitle">
      Enter your email address and we'll send you a secure
      password reset link.
    </p>

    <form id="forgotForm">

      <label for="email">
        Email address
      </label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <button
        id="submitBtn"
        class="submit-btn"
        type="submit"
      >
        Send Reset Link
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="back">
      Remember your password?
      <a href="login.html">Back to Login</a>
    </div>

  </section>

</main>


<script>

  const SUPABASE_URL =
    "YOUR_SUPABASE_PROJECT_URL";

  const SUPABASE_PUBLISHABLE_KEY =
    "YOUR_SUPABASE_PUBLISHABLE_KEY";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const form =
    document.getElementById("forgotForm");

  const email =
    document.getElementById("email");

  const submitBtn =
    document.getElementById("submitBtn");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message show " + type;

  }


  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      message.className = "message";

      const emailValue =
        email.value.trim();

      if (!emailValue) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      submitBtn.disabled = true;

      submitBtn.textContent =
        "Sending...";


      try {

        const {
          error
        } =
          await supabaseClient.auth
            .resetPasswordForEmail(
              emailValue,
              {
                redirectTo:
                  window.location.origin +
                  "/reset-password.html"
              }
            );


        if (error) {
          throw error;
        }


        showMessage(
          "If an account exists for this email, a password reset link has been sent. Please check your inbox.",
          "success"
        );

        form.reset();


      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Unable to send the reset link. Please try again.",
          "error"
        );

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
          "Send Reset Link";

      }

    }
  );

</script>

</body>
</html>
