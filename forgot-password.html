<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | VoiceAI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f3efff, #faf9ff);
      color: #211b35;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 34px;
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(50, 30, 100, .12);
    }

    .logo {
      text-align: center;
      color: #7354e8;
      font-size: 29px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd8e9;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #7354e8;
      box-shadow: 0 0 0 3px rgba(115,84,232,.1);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 11px;
      background: #7354e8;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      text-align: center;
      margin-top: 23px;
      font-size: 14px;
    }

    a {
      color: #7354e8;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">∿ VoiceAI</div>

    <h1>Forgot password?</h1>

    <p class="subtitle">
      Enter your email and we'll send you a secure password reset link.
    </p>

    <form id="forgotForm">

      <label for="email">
        Email address
      </label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <button id="resetButton" type="submit">
        Send reset link
      </button>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite">
      </div>

    </form>

    <div class="links">
      <a href="login.html">← Back to Login</a>
    </div>

  </main>


  <script>

    const form =
      document.getElementById("forgotForm");

    const emailInput =
      document.getElementById("email");

    const resetButton =
      document.getElementById("resetButton");

    const message =
      document.getElementById("message");


    function showMessage(text, success = false) {

      message.style.display = "block";
      message.textContent = text;

      message.style.background =
        success ? "#eaf8ef" : "#fff0f0";

      message.style.color =
        success ? "#176b38" : "#a32323";

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        if (!email) {
          showMessage(
            "Please enter your email address."
          );
          return;
        }


        resetButton.disabled = true;

        resetButton.textContent =
          "Sending...";


        try {

          const {
            error
          } =
            await supabaseClient.auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    window.location.origin +
                    "/reset-password.html"
                }
              );


          if (error) {
            throw error;
          }


          /*
           * Supabase intentionally allows
           * a generic success message here.
           * This avoids revealing whether
           * an email exists.
           */

          showMessage(
            "If an account exists for this email, a password reset link has been sent. Please check your inbox.",
            true
          );

          emailInput.value = "";


        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "Unable to send reset link."
          );

        } finally {

          resetButton.disabled = false;

          resetButton.textContent =
            "Send reset link";

        }

      }
    );

  </script>

</body>
</html>
