<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password — VoiceAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #fffdf7;
      color: #3b2117;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 32px;
      font-weight: 800;
    }

    .brand span {
      color: #d96b27;
    }

    .brand p {
      margin-top: 8px;
      color: #806b61;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid #eee5df;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 18px 50px rgba(59, 33, 23, .08);
    }

    h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #806b61;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .password-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #ded4cd;
      border-radius: 12px;
      padding: 0 70px 0 14px;
      font-size: 15px;
      outline: none;
      color: #3b2117;
      background: #fff;
    }

    input:focus {
      border-color: #d96b27;
      box-shadow: 0 0 0 3px rgba(217, 107, 39, .12);
    }

    .show {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #d96b27;
      font-weight: 700;
      cursor: pointer;
      padding: 8px;
    }

    .btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 13px;
      background: #d96b27;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff0ed;
      color: #a93226;
      border: 1px solid #f4c7c0;
    }

    .message.success {
      background: #edf9f0;
      color: #28763b;
      border: 1px solid #c6e8ce;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    a {
      color: #d96b27;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .back {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 18px;
      }

      .brand h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">
      <h1>∿ Voice<span>AI</span></h1>
      <p>Securely update your password.</p>
    </div>

    <section class="card">

      <h2>Set new password</h2>

      <p class="subtitle">
        Choose a strong password for your VoiceAI account.
      </p>

      <div id="message" class="message"></div>

      <form id="resetForm">

        <div class="field">
          <label for="password">New password</label>

          <div class="password-wrap">
            <input
              id="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="Minimum 8 characters"
              required
            >

            <button
              type="button"
              class="show"
              id="showPassword"
            >
              Show
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">
            Confirm new password
          </label>

          <div class="password-wrap">
            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="Enter password again"
              required
            >

            <button
              type="button"
              class="show"
              id="showConfirm"
            >
              Show
            </button>
          </div>
        </div>

        <button
          id="resetBtn"
          class="btn"
          type="submit"
        >
          Update Password
        </button>

      </form>

      <div class="links">
        <a href="login.html">← Back to Login</a>
      </div>

      <div class="back">
        <a href="index.html">Back to VoiceAI</a>
      </div>

    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    "use strict";

    const supabaseClient = window.supabaseClient;

    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmInput =
      document.getElementById("confirmPassword");

    const resetBtn =
      document.getElementById("resetBtn");

    const message =
      document.getElementById("message");

    const showPassword =
      document.getElementById("showPassword");

    const showConfirm =
      document.getElementById("showConfirm");


    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className =
        "message show " + type;
    }


    function setLoading(loading) {
      resetBtn.disabled = loading;

      resetBtn.textContent = loading
        ? "Updating..."
        : "Update Password";
    }


    function togglePassword(input, button) {
      const hidden =
        input.type === "password";

      input.type = hidden
        ? "text"
        : "password";

      button.textContent =
        hidden ? "Hide" : "Show";
    }


    showPassword.addEventListener(
      "click",
      () => {
        togglePassword(
          passwordInput,
          showPassword
        );
      }
    );


    showConfirm.addEventListener(
      "click",
      () => {
        togglePassword(
          confirmInput,
          showConfirm
        );
      }
    );


    async function checkSession() {

      if (!supabaseClient) {
        showMessage(
          "Supabase is not connected. Check supabase-config.js."
        );
        return;
      }

      /*
       * Supabase password-reset links can arrive
       * with the recovery session in the URL.
       */

      const {
        data: { session },
        error
      } =
        await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);

        showMessage(
          "Unable to verify your reset session."
        );

        return;
      }

      if (!session) {
        showMessage(
          "This password reset link is invalid or expired. Please request a new link."
        );

        resetBtn.disabled = true;
      }
    }


    checkSession();


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        message.className = "message";

        const password =
          passwordInput.value;

        const confirm =
          confirmInput.value;


        if (password.length < 8) {
          showMessage(
            "Password must contain at least 8 characters."
          );

          passwordInput.focus();

          return;
        }


        if (password !== confirm) {
          showMessage(
            "Passwords do not match."
          );

          confirmInput.focus();

          return;
        }


        if (!supabaseClient) {
          showMessage(
            "Supabase is not connected."
          );

          return;
        }


        setLoading(true);


        try {

          const {
            data: { session },
            error: sessionError
          } =
            await supabaseClient.auth.getSession();


          if (sessionError) {
            throw sessionError;
          }


          if (!session) {
            throw new Error(
              "Your reset session has expired. Please request a new password reset link."
            );
          }


          const { error } =
            await supabaseClient.auth.updateUser({
              password: password
            });


          if (error) {
            throw error;
          }


          showMessage(
            "Password updated successfully. Redirecting to login...",
            "success"
          );


          await supabaseClient.auth.signOut();


          setTimeout(() => {
            window.location.replace("login.html");
          }, 1000);


        } catch (error) {

          console.error(
            "Password update error:",
            error
          );


          showMessage(
            error.message ||
            "Unable to update your password."
          );


          setLoading(false);
        }

      }
    );
  </script>

</body>
</html>
