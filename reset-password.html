<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password — VoiceAI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #f7f5fa;
      color: #17131f;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .navbar {
      height: 70px;
      background: #fff;
      border-bottom: 1px solid #e5e1eb;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    .nav-inner {
      width: min(1180px, 100%);
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 850;
    }

    .logo span {
      color: #6d3df5;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: #625d69;
      font-size: 14px;
      font-weight: 650;
    }

    .nav-links a:hover {
      color: #6d3df5;
    }

    .nav-btn {
      background: #6d3df5;
      color: white !important;
      padding: 10px 16px;
      border-radius: 10px;
    }

    .page {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 18px;
    }

    .card {
      width: min(470px, 100%);
      background: white;
      border: 1px solid #e5e1eb;
      border-radius: 24px;
      padding: 42px;
      box-shadow: 0 25px 70px rgba(40,25,70,.09);
    }

    .icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      background: #f0ebff;
      color: #6d3df5;
      border-radius: 16px;
      font-size: 27px;
      margin-bottom: 23px;
    }

    h1 {
      font-size: 31px;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #77717f;
      font-size: 14px;
      line-height: 1.65;
      margin-bottom: 27px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 750;
      margin-bottom: 8px;
    }

    .password-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #dfdbe6;
      border-radius: 12px;
      padding: 0 50px 0 15px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #6d3df5;
      box-shadow: 0 0 0 4px rgba(109,61,245,.09);
    }

    .toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #77717f;
      font-size: 17px;
    }

    .requirements {
      padding: 13px 14px;
      margin: 3px 0 21px;
      border-radius: 11px;
      background: #f8f7fb;
      color: #77717f;
      font-size: 12px;
      line-height: 1.7;
    }

    .requirements strong {
      color: #393440;
    }

    .submit-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 12px;
      background: #6d3df5;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #5528d8;
    }

    .submit-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 13px 14px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.55;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #ecf9f1;
      border: 1px solid #bce5ca;
      color: #176c43;
    }

    .message.error {
      background: #fff0f0;
      border: 1px solid #f1c3c3;
      color: #b42318;
    }

    .back {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #77717f;
    }

    .back a {
      color: #6d3df5;
      font-weight: 800;
    }

    @media (max-width: 600px) {

      .nav-links a:not(.nav-btn) {
        display: none;
      }

      .card {
        padding: 30px 22px;
        border-radius: 20px;
      }

      h1 {
        font-size: 28px;
      }

    }
  </style>
</head>

<body>

<header class="navbar">

  <div class="nav-inner">

    <a href="index.html" class="logo">
      Voice<span>AI</span>
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="tools.html">AI Tools</a>
      <a href="pricing.html">Pricing</a>
      <a href="login.html" class="nav-btn">
        Login
      </a>
    </nav>

  </div>

</header>


<main class="page">

  <section class="card">

    <div class="icon">🔑</div>

    <h1>Reset password</h1>

    <p class="subtitle">
      Create a new secure password for your VoiceAI account.
    </p>


    <form id="resetForm">

      <div class="form-group">

        <label for="password">
          New password
        </label>

        <div class="password-wrap">

          <input
            id="password"
            type="password"
            placeholder="Enter new password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle"
            id="togglePassword"
          >
            ◉
          </button>

        </div>

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Confirm password
        </label>

        <div class="password-wrap">

          <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm new password"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle"
            id="toggleConfirm"
          >
            ◉
          </button>

        </div>

      </div>


      <div class="requirements">

        <strong>Password requirements</strong><br>

        Use at least 8 characters with a
        combination of letters and numbers.

      </div>


      <button
        id="submitBtn"
        class="submit-btn"
        type="submit"
      >
        Update Password
      </button>

    </form>


    <div id="message" class="message"></div>


    <div class="back">
      Remember your password?
      <a href="login.html">Back to Login</a>
    </div>

  </section>

</main>


<script>

  const SUPABASE_URL =
    "YOUR_SUPABASE_PROJECT_URL";

  const SUPABASE_PUBLISHABLE_KEY =
    "YOUR_SUPABASE_PUBLISHABLE_KEY";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const form =
    document.getElementById("resetForm");

  const password =
    document.getElementById("password");

  const confirmPassword =
    document.getElementById("confirmPassword");

  const submitBtn =
    document.getElementById("submitBtn");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message show " + type;

  }


  function toggleInput(input) {

    input.type =
      input.type === "password"
        ? "text"
        : "password";

  }


  document
    .getElementById("togglePassword")
    .addEventListener(
      "click",
      () => toggleInput(password)
    );


  document
    .getElementById("toggleConfirm")
    .addEventListener(
      "click",
      () => toggleInput(confirmPassword)
    );


  /* =========================================
     SUPABASE AUTH STATE
     ========================================= */

  let recoverySessionReady = false;


  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (
        event === "PASSWORD_RECOVERY" &&
        session
      ) {

        recoverySessionReady = true;

      }

    }
  );


  /* =========================================
     RESET PASSWORD
     ========================================= */

  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      message.className = "message";


      const newPassword =
        password.value;

      const confirm =
        confirmPassword.value;


      if (newPassword.length < 8) {

        showMessage(
          "Password must contain at least 8 characters.",
          "error"
        );

        return;

      }


      if (newPassword !== confirm) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }


      submitBtn.disabled = true;

      submitBtn.textContent =
        "Updating...";


      try {

        const {
          data: {
            session
          }
        } =
          await supabaseClient.auth.getSession();


        if (!session) {

          throw new Error(
            "This reset link is invalid or has expired. Please request a new reset link."
          );

        }


        const {
          error
        } =
          await supabaseClient.auth
            .updateUser({
              password: newPassword
            });


        if (error) {
          throw error;
        }


        showMessage(
          "Password updated successfully. Redirecting to login...",
          "success"
        );


        form.reset();


        setTimeout(
          async () => {

            await supabaseClient.auth.signOut();

            window.location.href =
              "login.html";

          },
          1200
        );


      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Unable to update password.",
          "error"
        );

        submitBtn.disabled = false;

        submitBtn.textContent =
          "Update Password";

      }

    }
  );

</script>

</body>
</html>
