<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account — VoiceAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: #fffdf7;
      color: #3b2117;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 450px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand span {
      color: #d96b27;
    }

    .brand p {
      margin-top: 8px;
      color: #806b61;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid #eee5df;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 18px 50px rgba(59, 33, 23, 0.08);
    }

    h2 {
      font-size: 24px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #806b61;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #ded4cd;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 15px;
      color: #3b2117;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #d96b27;
      box-shadow: 0 0 0 3px rgba(217, 107, 39, .12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 70px;
    }

    .show {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #d96b27;
      font-weight: 700;
      cursor: pointer;
      padding: 8px;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 7px 0 20px;
      color: #6f5c53;
      font-size: 13px;
      line-height: 1.45;
    }

    .terms input {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .terms a,
    .login a,
    .back a {
      color: #d96b27;
      font-weight: 700;
      text-decoration: none;
    }

    .terms a:hover,
    .login a:hover,
    .back a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 13px;
      background: #d96b27;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff0ed;
      color: #a93226;
      border: 1px solid #f4c7c0;
    }

    .message.success {
      background: #edf9f0;
      color: #28763b;
      border: 1px solid #c6e8ce;
    }

    .login {
      text-align: center;
      margin-top: 22px;
      color: #806b61;
      font-size: 14px;
    }

    .back {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 18px;
      }

      .brand h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">
      <h1>∿ Voice<span>AI</span></h1>
      <p>Create, generate and manage your AI voices.</p>
    </div>

    <section class="card">

      <h2>Create your account</h2>

      <p class="subtitle">
        Start creating professional AI voice content with VoiceAI.
      </p>

      <div id="message" class="message"></div>

      <form id="signupForm">

        <div class="field">
          <label for="fullName">Full name</label>

          <input
            id="fullName"
            type="text"
            autocomplete="name"
            placeholder="Your full name"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email address</label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="password-wrap">
            <input
              id="password"
              type="password"
              autocomplete="new-password"
              placeholder="Minimum 8 characters"
              minlength="8"
              required
            >

            <button
              type="button"
              class="show"
              id="showPassword"
            >
              Show
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">
            Confirm password
          </label>

          <div class="password-wrap">
            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Enter password again"
              minlength="8"
              required
            >

            <button
              type="button"
              class="show"
              id="showConfirm"
            >
              Show
            </button>
          </div>
        </div>

        <label class="terms">
          <input
            id="terms"
            type="checkbox"
            required
          >

          <span>
            I agree to the
            <a href="index.html">VoiceAI terms</a>
            and understand the free plan includes 5 AI uses per day.
          </span>
        </label>

        <button
          type="submit"
          class="btn"
          id="signupBtn"
        >
          Create Account
        </button>

      </form>

      <div class="login">
        Already have an account?
        <a href="login.html">Sign in</a>
      </div>

      <div class="back">
        <a href="index.html">← Back to VoiceAI</a>
      </div>

    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    "use strict";

    const supabaseClient = window.supabaseClient;

    const form = document.getElementById("signupForm");
    const fullName = document.getElementById("fullName");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword =
      document.getElementById("confirmPassword");

    const terms = document.getElementById("terms");
    const signupBtn = document.getElementById("signupBtn");
    const message = document.getElementById("message");

    const showPassword =
      document.getElementById("showPassword");

    const showConfirm =
      document.getElementById("showConfirm");


    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message show " + type;
    }


    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }


    function setLoading(loading) {
      signupBtn.disabled = loading;

      signupBtn.textContent = loading
        ? "Creating account..."
        : "Create Account";
    }


    function togglePassword(input, button) {
      const hidden = input.type === "password";

      input.type = hidden
        ? "text"
        : "password";

      button.textContent = hidden
        ? "Hide"
        : "Show";
    }


    showPassword.addEventListener("click", () => {
      togglePassword(password, showPassword);
    });


    showConfirm.addEventListener("click", () => {
      togglePassword(confirmPassword, showConfirm);
    });


    async function checkExistingSession() {

      if (!supabaseClient) {
        showMessage(
          "Supabase connection is not available. Check supabase-config.js."
        );

        return;
      }

      const {
        data: { session },
        error
      } = await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);
        return;
      }

      if (session) {
        window.location.replace("profile.html");
      }
    }


    checkExistingSession();


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      clearMessage();

      const nameValue = fullName.value.trim();
      const emailValue = email.value.trim();
      const passwordValue = password.value;
      const confirmValue = confirmPassword.value;


      if (!nameValue) {
        showMessage("Please enter your full name.");
        fullName.focus();
        return;
      }


      if (passwordValue.length < 8) {
        showMessage(
          "Password must contain at least 8 characters."
        );

        password.focus();
        return;
      }


      if (passwordValue !== confirmValue) {
        showMessage(
          "Passwords do not match."
        );

        confirmPassword.focus();
        return;
      }


      if (!terms.checked) {
        showMessage(
          "Please accept the terms to continue."
        );

        return;
      }


      if (!supabaseClient) {
        showMessage(
          "Supabase is not connected. Check supabase-config.js."
        );

        return;
      }


      setLoading(true);


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: emailValue,

            password: passwordValue,

            options: {

              data: {
                full_name: nameValue
              },

              emailRedirectTo:
                window.location.origin +
                "/login.html"
            }
          });


        if (error) {
          throw error;
        }


        /*
         * Supabase can either:
         *
         * 1. Create an immediate session
         * 2. Require email confirmation
         *
         * We support both.
         */


        if (data.session) {

          showMessage(
            "Account created successfully. Opening your profile...",
            "success"
          );

          setTimeout(() => {
            window.location.replace("profile.html");
          }, 700);

          return;
        }


        showMessage(
          "Account created. Please check your email and confirm your account before signing in.",
          "success"
        );


        form.reset();

        setLoading(false);


      } catch (error) {

        console.error(
          "Signup error:",
          error
        );


        let text =
          error.message ||
          "Unable to create your account.";


        if (
          text.toLowerCase().includes(
            "user already registered"
          )
        ) {
          text =
            "This email is already registered. Please sign in instead.";
        }


        if (
          text.toLowerCase().includes(
            "password should be at least"
          )
        ) {
          text =
            "Password must contain at least 8 characters.";
        }


        showMessage(text);

        setLoading(false);
      }

    });

  </script>

</body>
</html>
