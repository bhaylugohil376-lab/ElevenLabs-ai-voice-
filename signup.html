
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | VoiceAI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #211b35;
      background: linear-gradient(135deg, #f1eaff, #f8f7ff);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 16px 50px #35205a18;
    }

    .logo {
      color: #7354e8;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
    }

    h1 { text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #777; margin-bottom: 25px; }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dedbe8;
      border-radius: 10px;
      font-size: 15px;
      outline-color: #7354e8;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #7354e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-top: 15px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .signin { text-align: center; margin-top: 22px; color: #666; }
    a { color: #7354e8; text-decoration: none; font-weight: 600; }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">∿ VoiceAI</div>
    <h1>Create your account</h1>
    <p class="subtitle">Start creating with AI voices.</p>

    <form id="signupForm">
      <label for="fullName">Full name</label>
      <input id="fullName" type="text" autocomplete="name"
             placeholder="Your name" required>

      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password"
             placeholder="At least 8 characters" minlength="8" required>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password"
             placeholder="Enter password again" minlength="8" required>

      <label>
        <input id="terms" type="checkbox" required
               style="width:auto; margin-right:8px;">
        I agree to the Terms and Privacy Policy.
      </label>

      <button id="signupButton" type="submit">Create account</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <p class="signin">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </main>

  <script>
    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.style.display = "block";
      message.textContent = text;
      message.style.color = success ? "#176b38" : "#a32323";
      message.style.background = success ? "#e9f8ee" : "#fff0f0";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage("Password must be at least 8 characters.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
      }

      if (!window.supabase || typeof supabaseClient === "undefined") {
        showMessage("Supabase config load nahi hua. supabase-config.js check karo.");
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: fullName },
            emailRedirectTo: window.location.origin + "/login.html"
          }
        });

        if (error) throw error;

        if (data.session) {
          window.location.href = "profile.html";
          return;
        }

        showMessage(
          "Account request successful! If email confirmation is enabled, check your inbox to verify your account.",
          true
        );
        form.reset();
      } catch (error) {
        showMessage(error.message || "Signup failed. Please try again.");
      } finally {
        button.disabled = false;
        button.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
