<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Voice Library — VoiceAI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,Arial,sans-serif;
  background:#f7f7fb;
  color:#17151d;
  overflow-x:hidden
}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}

.navbar{
  height:72px;background:#fff;border-bottom:1px solid #e8e6ee;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 5%;position:sticky;top:0;z-index:100
}
.logo{font-size:24px;font-weight:800}
.logo span{color:#6d28d9}
.nav-links{display:flex;gap:25px;align-items:center}
.nav-links a{font-size:14px;font-weight:600;color:#65616f}
.nav-links a:hover,.nav-links a.active{color:#6d28d9}
.nav-actions{display:flex;gap:9px}
.btn{
  border:0;border-radius:10px;padding:11px 17px;
  cursor:pointer;font-weight:700
}
.btn-light{background:#f1eef7;color:#3b3445}
.btn-primary{background:#6d28d9;color:#fff}
.btn-primary:hover{background:#5b21b6}

.hero{
  max-width:1200px;margin:auto;padding:65px 24px 35px;text-align:center
}
.badge{
  display:inline-block;padding:7px 13px;background:#eee7ff;
  color:#6422c4;border-radius:30px;font-size:12px;
  font-weight:800;margin-bottom:18px
}
.hero h1{
  font-size:48px;line-height:1.08;letter-spacing:-2px;margin-bottom:15px
}
.hero p{
  max-width:650px;margin:auto;color:#6b6874;line-height:1.7
}

.search-area{
  max-width:1100px;margin:10px auto 35px;padding:0 24px
}
.search-box{
  display:flex;background:#fff;border:1px solid #e4e1eb;
  border-radius:15px;padding:7px;box-shadow:0 8px 30px #17151d0a
}
.search-box input{
  flex:1;border:0;outline:0;padding:13px 15px;background:transparent
}
.search-box button{min-width:110px}

.filters{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;margin-top:13px
}
.filters select{
  border:1px solid #e2dfe9;background:#fff;
  border-radius:10px;padding:12px;outline:0;color:#403b49
}

.status{
  max-width:1100px;margin:0 auto 20px;padding:0 24px;
  display:flex;justify-content:space-between;align-items:center;
  color:#6b6874;font-size:14px
}

.grid{
  max-width:1100px;margin:auto;padding:0 24px 60px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px
}

.card{
  background:#fff;border:1px solid #e6e3eb;border-radius:18px;
  padding:20px;transition:.2s;min-width:0
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 35px #17151d0c
}

.voice-top{
  display:flex;align-items:center;gap:13px;margin-bottom:15px
}
.avatar{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#6d28d9,#a855f7);
  color:#fff;font-weight:800;font-size:18px;flex-shrink:0
}
.voice-name{
  font-size:17px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.voice-meta{
  color:#77727f;font-size:12px;margin-top:4px
}
.description{
  color:#6b6874;font-size:13px;line-height:1.6;
  min-height:42px;margin-bottom:15px
}

.tags{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px
}
.tag{
  background:#f3f0f8;color:#655c70;
  border-radius:20px;padding:5px 9px;font-size:11px
}

.audio-row{
  background:#f7f5fa;border-radius:11px;padding:9px;margin-bottom:12px
}
audio{width:100%;height:36px}

.actions{display:flex;gap:8px}
.actions button{
  flex:1;border:0;border-radius:9px;
  padding:10px;cursor:pointer;font-weight:700
}
.preview-btn{background:#eeeafa;color:#5d27a7}
.use-btn{background:#6d28d9;color:#fff}

.empty{
  grid-column:1/-1;text-align:center;
  padding:70px 20px;background:#fff;border-radius:18px;
  border:1px solid #e6e3eb;color:#6b6874
}
.spinner{
  width:28px;height:28px;border:3px solid #ddd;
  border-top-color:#6d28d9;border-radius:50%;
  animation:spin .7s linear infinite;margin:25px auto
}
@keyframes spin{to{transform:rotate(360deg)}}

.load-wrap{text-align:center;padding:0 24px 60px}
.load-btn{
  border:1px solid #ddd6e8;background:#fff;
  padding:12px 24px;border-radius:10px;
  cursor:pointer;font-weight:700
}
.load-btn:disabled{opacity:.5;cursor:not-allowed}

.mobile-menu{display:none}

@media(max-width:950px){
  .nav-links{display:none}
  .mobile-menu{display:block}
  .filters{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:40px}
}

@media(max-width:620px){
  .navbar{height:64px;padding:0 18px}
  .nav-actions .btn-light{display:none}
  .hero{padding:45px 18px 30px}
  .hero h1{font-size:34px}
  .hero p{font-size:14px}
  .search-area{padding:0 15px}
  .filters{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr;padding:0 15px 45px}
  .status{padding:0 15px}
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index.html" class="logo">Voice<span>AI</span></a>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="tools.html">AI Tools</a>
    <a href="voices.html" class="active">Voices</a>
    <a href="studio.html">Studio</a>
    <a href="pricing.html">Pricing</a>
  </div>

  <div class="nav-actions">
    <a href="login.html" class="btn btn-light">Login</a>
    <a href="pricing.html" class="btn btn-primary">Get Started</a>
  </div>

  <button class="mobile-menu btn btn-light"
          onclick="location.href='tools.html'">
    Menu
  </button>
</nav>

<section class="hero">
  <span class="badge">REAL AI VOICE LIBRARY</span>

  <h1>Find the perfect voice.</h1>

  <p>
    Explore your available ElevenLabs voices, preview them instantly,
    and use any voice directly inside VoiceAI Text to Speech.
  </p>
</section>

<section class="search-area">

  <div class="search-box">
    <input
      id="search"
      type="search"
      placeholder="Search voices, accents, styles..."
      autocomplete="off"
    >

    <button
      class="btn btn-primary"
      onclick="loadVoices(true)">
      Search
    </button>
  </div>

  <div class="filters">

    <select id="gender">
      <option value="">All genders</option>
      <option value="female">Female</option>
      <option value="male">Male</option>
      <option value="neutral">Neutral</option>
    </select>

    <select id="language">
      <option value="">All languages</option>
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="gu">Gujarati</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="ja">Japanese</option>
    </select>

    <select id="category">
      <option value="">All categories</option>
      <option value="premade">Premade</option>
      <option value="professional">Professional</option>
      <option value="cloned">Cloned</option>
      <option value="generated">Generated</option>
      <option value="library">Library</option>
    </select>

    <select id="age">
      <option value="">All ages</option>
      <option value="young">Young</option>
      <option value="middle_aged">Middle aged</option>
      <option value="old">Old</option>
    </select>

    <select id="sort">
      <option value="name">Name</option>
      <option value="newest">Newest</option>
      <option value="popular">Popular</option>
    </select>

  </div>
</section>

<div class="status">
  <span id="statusText">Loading voices...</span>
  <span id="countText"></span>
</div>

<main id="voiceGrid" class="grid">
  <div class="empty">
    <div class="spinner"></div>
    Loading Voice Library...
  </div>
</main>

<div class="load-wrap">
  <button
    id="loadMore"
    class="load-btn"
    onclick="loadMore()"
    disabled>
    Load More Voices
  </button>
</div>

<script>
const state = {
  voices: [],
  nextPageToken: null,
  loading: false
};

const grid = document.getElementById("voiceGrid");
const statusText = document.getElementById("statusText");
const countText = document.getElementById("countText");
const loadMoreBtn = document.getElementById("loadMore");

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getLabel(voice, key) {
  const labels = voice.labels || {};
  return labels[key] || "";
}

function getInitial(name) {
  const clean = String(name || "V").trim();
  return clean.charAt(0).toUpperCase();
}

function voiceCard(voice) {

  const name = voice.name || "Unnamed Voice";
  const category = voice.category || "AI Voice";

  const gender = getLabel(voice, "gender");
  const age = getLabel(voice, "age");
  const accent = getLabel(voice, "accent");
  const language = getLabel(voice, "language");

  const description =
    voice.description ||
    "Natural AI voice available in VoiceAI.";

  const preview = voice.preview_url;

  let tags = "";

  [gender, age, accent, language, category]
    .filter(Boolean)
    .slice(0, 4)
    .forEach(tag => {
      tags += `<span class="tag">${escapeHTML(tag)}</span>`;
    });

  const audio = preview
    ? `
      <div class="audio-row">
        <audio controls preload="none" src="${escapeHTML(preview)}"></audio>
      </div>
    `
    : "";

  return `
    <article class="card">

      <div class="voice-top">

        <div class="avatar">
          ${escapeHTML(getInitial(name))}
        </div>

        <div style="min-width:0">
          <div class="voice-name">
            ${escapeHTML(name)}
          </div>

          <div class="voice-meta">
            ${escapeHTML(category)}
          </div>
        </div>

      </div>

      <div class="description">
        ${escapeHTML(description)}
      </div>

      <div class="tags">
        ${tags}
      </div>

      ${audio}

      <div class="actions">

        ${
          preview
          ? `
            <button
              class="preview-btn"
              onclick="previewVoice('${escapeHTML(preview)}')">
              ▶ Preview
            </button>
          `
          : `
            <button
              class="preview-btn"
              disabled>
              No Preview
            </button>
          `
        }

        <button
          class="use-btn"
          onclick="useVoice('${encodeURIComponent(voice.voice_id)}')">
          Use Voice
        </button>

      </div>

    </article>
  `;
}

function renderVoices() {

  if (!state.voices.length) {
    grid.innerHTML = `
      <div class="empty">
        <h3>No voices found</h3>
        <p style="margin-top:8px">
          Try another search or filter.
        </p>
      </div>
    `;

    countText.textContent = "";
    return;
  }

  grid.innerHTML =
    state.voices.map(voiceCard).join("");

  countText.textContent =
    `${state.voices.length} loaded`;
}

async function loadVoices(reset = false) {

  if (state.loading) return;

  state.loading = true;

  if (reset) {
    state.voices = [];
    state.nextPageToken = null;

    grid.innerHTML = `
      <div class="empty">
        <div class="spinner"></div>
        Searching voices...
      </div>
    `;
  }

  statusText.textContent = "Loading voices...";
  loadMoreBtn.disabled = true;

  try {

    const params = new URLSearchParams();

    const search =
      document.getElementById("search").value.trim();

    const gender =
      document.getElementById("gender").value;

    const language =
      document.getElementById("language").value;

    const category =
      document.getElementById("category").value;

    const age =
      document.getElementById("age").value;

    params.set("page_size", "100");

    if (search)
      params.set("search", search);

    if (gender)
      params.set("gender", gender);

    if (language)
      params.set("language", language);

    if (category)
      params.set("category", category);

    if (age)
      params.set("age", age);

    if (!reset && state.nextPageToken) {
      params.set(
        "page_token",
        state.nextPageToken
      );
    }

    const response = await fetch(
      `/api/voices?${params.toString()}`,
      {
        method: "GET",
        credentials: "same-origin",
        headers: {
          "Accept": "application/json"
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Unable to load voices"
      );
    }

    const newVoices =
      Array.isArray(data.voices)
        ? data.voices
        : [];

    state.voices = [
      ...state.voices,
      ...newVoices
    ];

    state.nextPageToken =
      data.next_page_token || null;

    renderVoices();

    statusText.textContent =
      state.voices.length
        ? "Voice Library ready"
        : "No voices found";

    loadMoreBtn.disabled =
      !state.nextPageToken;

  } catch (error) {

    console.error(error);

    if (!state.voices.length) {
      grid.innerHTML = `
        <div class="empty">
          <h3>Unable to load voices</h3>

          <p style="margin-top:8px">
            ${escapeHTML(error.message)}
          </p>

          <button
            class="btn btn-primary"
            style="margin-top:18px"
            onclick="loadVoices(true)">
            Try Again
          </button>
        </div>
      `;
    }

    statusText.textContent =
      "Voice loading failed";

  } finally {

    state.loading = false;

    loadMoreBtn.disabled =
      !state.nextPageToken ||
      state.loading;
  }
}

function loadMore() {
  loadVoices(false);
}

function previewVoice(url) {

  if (!url) return;

  const audio = new Audio(url);

  audio.play().catch(() => {
    alert("Preview could not be played.");
  });
}

function useVoice(voiceId) {

  if (!voiceId) return;

  const decoded =
    decodeURIComponent(voiceId);

  location.href =
    `tts.html?voice=${encodeURIComponent(decoded)}`;
}

document
  .getElementById("search")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      loadVoices(true);
    }

  });

[
  "gender",
  "language",
  "category",
  "age",
  "sort"
].forEach(id => {

  document
    .getElementById(id)
    .addEventListener("change", () => {
      loadVoices(true);
    });

});

loadVoices(true);
</script>

</body>
</html>
